# Single instance. nginx does NOT forward the original Host by default; the gateway needs it
# for subdomain routing, hence proxy_set_header Host $host.
# TLS: sudo certbot --nginx -d app-a.mydomain.com -d app-b.mydomain.com
#      (wildcard *.mydomain.com needs the DNS challenge, e.g. python3-certbot-dns-cloudflare)
server {
    listen 80;
    server_name *.mydomain.com;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
